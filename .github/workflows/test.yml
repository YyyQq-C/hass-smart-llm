name: Test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest aiohttp cryptography
      - name: Run unit tests
        run: pytest
      - name: Validate integration JSON
        run: python -m json.tool custom_components/smart_llm/manifest.json >/dev/null && python -m json.tool custom_components/smart_llm/strings.json >/dev/null && python -m json.tool custom_components/smart_llm/translations/en.json >/dev/null && python -m json.tool custom_components/smart_llm/translations/zh-Hans.json >/dev/null && python -m json.tool hacs.json >/dev/null
